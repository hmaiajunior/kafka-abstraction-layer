# KRaft single-node combined broker+controller for cluster-b.
# External listener: SSL with mutual TLS.
# Controller listener: PLAINTEXT (loopback only).

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka-b:9096

listeners=CONTROLLER://0.0.0.0:9096,EXTERNAL://0.0.0.0:9095
advertised.listeners=EXTERNAL://kafka-b:9095
listener.security.protocol.map=CONTROLLER:PLAINTEXT,EXTERNAL:SSL
inter.broker.listener.name=EXTERNAL
controller.listener.names=CONTROLLER

ssl.keystore.location=/certs/cluster-b/kafka-b-keystore.jks
ssl.keystore.password=kafka123
ssl.key.password=kafka123
ssl.truststore.location=/certs/cluster-b/kafka-b-truststore.jks
ssl.truststore.password=kafka123
ssl.client.auth=required
ssl.endpoint.identification.algorithm=

log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=true
group.initial.rebalance.delay.ms=0
