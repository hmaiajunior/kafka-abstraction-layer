# KRaft single-node combined broker+controller for cluster-a.
# External listener: SSL with mutual TLS (used by SDK, SR, kafka-ui, consumer).
# Controller listener: PLAINTEXT (loopback only).

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka-a:9093

listeners=CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
advertised.listeners=EXTERNAL://kafka-a:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,EXTERNAL:SSL
inter.broker.listener.name=EXTERNAL
controller.listener.names=CONTROLLER

ssl.keystore.location=/certs/cluster-a/kafka-a-keystore.jks
ssl.keystore.password=kafka123
ssl.key.password=kafka123
ssl.truststore.location=/certs/cluster-a/kafka-a-truststore.jks
ssl.truststore.password=kafka123
ssl.client.auth=required
ssl.endpoint.identification.algorithm=

log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=true
group.initial.rebalance.delay.ms=0
